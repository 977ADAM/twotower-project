[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twotower"
version = "0.1.0"
description = "Two-tower retrieval model with fit, predict, evaluate, save_model, and load_model APIs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "977ADAM", email = "977team.95@gmail.com" }]
requires-python = ">=3.11"
keywords = ["recommendation", "retrieval", "two-tower", "machine-learning", "pytorch", "recsys"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=3.0.2",
    "rich>=15.0.0",
    "torch>=2.11.0",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.136.0",
    "gradio>=6.12.0",
    "pydantic>=2.13.2",
    "uvicorn>=0.44.0",
]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.0.3",
    "ruff>=0.11.0",
]

[project.urls]
Repository = "https://github.com/977ADAM/twotower"
Issues = "https://github.com/977ADAM/twotower/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["twotower", "twotower.*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
twotower = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
